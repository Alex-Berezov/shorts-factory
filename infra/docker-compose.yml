name: shorts-factory
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sf
      POSTGRES_PASSWORD: sf
      POSTGRES_DB: shorts_factory
    # Host port is deliberately not the Postgres default: a developer machine
    # usually already runs another project's Postgres on 5432, and the two
    # would fight for the binding. Container-side port stays standard.
    ports: ["127.0.0.1:5442:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init scripts run once, only on a fresh volume; on an existing volume
      # re-create with `docker compose down -v` or run the SQL by hand.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Same reason as Postgres above: 6379 is usually taken on a dev machine.
    ports: ["127.0.0.1:6389:6379"]
    volumes: [redisdata:/data]
    command: ["redis-server", "--appendonly", "yes"]

  # api / worker / web are run via `pnpm dev` locally in MVP.
  # Production Dockerfiles will be added in epic E0 decomposition.

volumes:
  pgdata:
  redisdata:
