name: ci
# Branches reach CI through their pull request, main through its pushes: one
# run per commit, nothing for a second event to cancel.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request is one group: a newer commit cancels the superseded run, and
# the number keeps a fork's branch of the same name out of it. On main the
# group is the commit: nothing is cancelled, every pushed commit keeps a
# finished result in `gh run list`.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same images and host ports as infra/docker-compose.yml and .env.test, and
    # the Redis healthcheck of Compose: redis-cli exits 0 on an error reply
    # too, and a Redis replaying its append-only file answers LOADING.
    # The test database is made by POSTGRES_DB: the init script of the repository
    # cannot be mounted, services start before checkout.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sf
          POSTGRES_PASSWORD: sf
          POSTGRES_DB: shorts_factory_test
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U sf -d shorts_factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          - 6389:6379
        options: >-
          --health-cmd "redis-cli ping | grep -qx PONG"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # node-version 22 with check-latest is the newest 22.x, not a 22.x the
      # runner has cached: at or above the engines floor (22.18,
      # package.json) - test/imports.ts is loaded with require.
      - uses: actions/setup-node@v4
        with: { node-version: 22, check-latest: true, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The local cache of turbo (.turbo/cache, the default of turbo 2.10)
      # replays a task whose inputs did not change. One archive per ISO week:
      # the first green run of the week saves it, later runs restore it as
      # it is - the cache action saves nothing on a key it hit. A pull
      # request saves into the scope of its branch, main restores only from
      # main: a fork cannot put an archive there.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ steps.week.outputs.week }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The gates run in the form of .claude/hooks/rules.sf.json.
      - run: node scripts/check-no-search-list.mjs
      # check-compose reads create_host_path from `docker compose config`, and
      # the Compose of the runner image (v2.38) does not print it when false.
      # The pinned binary is downloaded to a temporary file, checked against
      # its release checksum there, and only then installed in place of the
      # image's plugin for this job; the gate's own probe stops on any Compose
      # that loses the option (scripts/compose-rules.mjs).
      - name: Install Docker Compose v5.5.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$RUNNER_TEMP/docker-compose" https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64
          echo "db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576  $RUNNER_TEMP/docker-compose" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          test "$(docker compose version --short)" = "5.5.1"
      - run: node scripts/check-compose.mjs
      - run: node scripts/tasks.mjs render --check
      - run: node .claude/hooks/harness-selftest.js
      # Schema drift: a change of packages/db/src/schema without the migration
      # it needs. The rules live in the script, the gate of the same name runs
      # it locally. It runs drizzle-kit generate with stdin closed and a time
      # limit, through the same tsx bypass as `db:generate`, so a drizzle
      # upgrade that breaks the bypass turns this red too; generate exits with
      # 0 on an ambiguous rename (it asks "created or renamed" and gives up)
      # and on snapshots that collide (two branches that each added a
      # migration), so the script reads its output and fails on both, and on
      # a run that stopped before its closing line. Generate writes into a
      # temporary copy of the migrations folder, never into the tree: any
      # file of the copy it added or changed is drift. db:check is the second
      # line: the folder itself. Another installed version of drizzle-kit
      # fails the step until its output is recorded again
      # (test/schema-drift-fixture.ts). The step outlasts the two runs of
      # drizzle-kit, so the script, not the runner, says why a run stopped.
      - name: Schema drift
        timeout-minutes: 5
        run: node scripts/check-schema-drift.mjs
      # The entry of `pnpm db:migrate` with .env.test read by node's dotenv parser,
      # not by a shell. --env-file sets only what the environment lacks, so a
      # variable the runner already has wins over the file. For this step only:
      # NODE_ENV=test must not reach `next build`.
      # What it proves: src/cli/migrate.ts starts from .env.test, opens its one
      # connection and applies every migration to the empty database of CI,
      # before resetTestDatabase of the integration suites rebuilds the schema.
      # The CLI has no guard of the host on purpose: it migrates whatever
      # DATABASE_URL names (E1-12, decision R5 of E0-12C).
      - working-directory: packages/db
        run: node --env-file=../../.env.test --import tsx src/cli/migrate.ts
      - run: pnpm test:int
      - run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The matrix lists the targets of infra/docker/app.Dockerfile
    # (test/ci-config.test.ts).
    strategy:
      fail-fast: false
      matrix:
        image: [api, migrate, web, worker]
    steps:
      - uses: actions/checkout@v4
      # node-version 22 with check-latest is the newest 22.x, not a 22.x the
      # runner has cached: at or above the engines floor (22.18,
      # package.json) - test/imports.ts is loaded with require.
      - uses: actions/setup-node@v4
        with: { node-version: 22, check-latest: true }
      - uses: docker/setup-buildx-action@v3
      # One target of the one Dockerfile, loaded into the local engine for the
      # probe under the tag it runs by default (imageTag of
      # scripts/probe-image.mjs). The layer cache of each target has a scope
      # of its own; mode=max keeps the intermediate stages too. Only `base`
      # and `fetch` (the lockfile alone) are hit across commits that keep the
      # lockfile: the install stages follow `COPY . .`, so a change of any
      # source rebuilds them (docs/TECH_DEBT.md). A cache that cannot be
      # written leaves the build green (ignore-error=true): the cache only
      # saves time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/app.Dockerfile
          target: ${{ matrix.image }}
          tags: sf-${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true
      # An image whose install put nothing in place must turn the job red.
      - name: Probe installed dependencies
        run: node scripts/probe-image.mjs ${{ matrix.image }}
